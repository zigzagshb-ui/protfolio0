<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e1e2c"/>
      <stop offset="60%" stop-color="#12121a"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#9a7b1c"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(212, 175, 55, 0.4)"/>
      <stop offset="100%" stop-color="rgba(212, 175, 55, 0)"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" rx="36" fill="url(#bgGrad)"/>

  <!-- Subtle Circuit / Automation Patterns -->
  <g stroke="rgba(212, 175, 55, 0.15)" stroke-width="1.5" fill="none">
    <circle cx="300" cy="300" r="230" stroke-dasharray="6 8"/>
    <circle cx="300" cy="300" r="180" stroke="rgba(255, 255, 255, 0.04)"/>
    <path d="M 70 300 H 160 L 200 260 H 240"/>
    <circle cx="70" cy="300" r="4" fill="#d4af37"/>
    <circle cx="240" cy="260" r="3" fill="#d4af37"/>
    <path d="M 530 300 H 440 L 400 340 H 360"/>
    <circle cx="530" cy="300" r="4" fill="#d4af37"/>
    <circle cx="360" cy="340" r="3" fill="#d4af37"/>
    <path d="M 300 70 V 160 L 260 200"/>
    <circle cx="300" cy="70" r="4" fill="#d4af37"/>
    <path d="M 300 530 V 440 L 340 400"/>
    <circle cx="300" cy="530" r="4" fill="#d4af37"/>
  </g>

  <!-- Outer Ring with Gold Accent -->
  <circle cx="300" cy="300" r="140" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" filter="url(#subtleGlow)"/>
  <circle cx="300" cy="300" r="132" fill="#14141f" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

  <!-- Monogram MM -->
  <text x="300" y="325" 
        font-family="'Space Grotesk', -apple-system, sans-serif" 
        font-size="88" 
        font-weight="700" 
        letter-spacing="4" 
        fill="url(#goldGrad)" 
        text-anchor="middle"
        filter="drop-shadow(0 4px 12px rgba(0,0,0,0.5))">
    MM
  </text>

  <!-- Title Pill at Bottom -->
  <g transform="translate(180, 470)">
    <rect width="240" height="38" rx="19" fill="#1c1c28" stroke="rgba(212, 175, 55, 0.3)" stroke-width="1"/>
    <text x="120" y="24" 
          font-family="'Space Grotesk', -apple-system, sans-serif" 
          font-size="13" 
          font-weight="600" 
          letter-spacing="1.5" 
          fill="#d4af37" 
          text-anchor="middle">
      SOFTWARE DEVELOPER
    </text>
  </g>
</svg>